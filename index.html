<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="monetag" content="df6e63c443fcd342ae7cbb4c21e3543c">
  <title>EarnDuo AI - Spin & Earn</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: #161f30;
      border-radius: 12px;
      margin-bottom: 15px;
      border: 1px solid #22324d;
    }
    .balance-box {
      font-size: 15px;
      color: #94a3b8;
    }
    .balance-box span {
      color: #10b981;
      font-weight: 700;
      font-size: 18px;
    }
    .wheel-card {
      width: 100%;
      max-width: 420px;
      background: #161f30;
      border-radius: 16px;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #22324d;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .spins-left {
      margin-bottom: 12px;
      font-size: 13px;
      color: #38bdf8;
      font-weight: 600;
    }
    .wheel-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin-bottom: 20px;
    }
    .arrow {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #ef4444;
      z-index: 10;
    }
    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-spin {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }
    .btn-spin:disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }
    .section-card {
      width: 100%;
      max-width: 420px;
      background: #161f30;
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
      border: 1px solid #22324d;
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 15px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: #0b0f19;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #94a3b8;
    }
    .tab.active {
      background: #1e293b;
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0b0f19;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #10b981;
    }
    .btn-withdraw {
      background: #38bdf8;
      color: #0b0f19;
      margin-top: 10px;
    }
    .btn-withdraw:disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <div style="font-weight: 700; font-size: 16px; color: #38bdf8;">EarnDuo AI</div>
    <div class="balance-box">Balance: <span id="userBalance">₹0.00</span></div>
  </div>

  <div class="wheel-card">
    <div class="spins-left" id="spinLimitDisplay">आज के बचे स्पिन: 10/10</div>
    <div class="wheel-container">
      <div class="arrow"></div>
      <canvas id="wheel" width="280" height="280"></canvas>
    </div>
    <button id="spinBtn" class="btn btn-spin" onclick="startSpin()">घुमाओ और जीतो (SPIN)</button>
  </div>

  <div class="section-card">
    <div class="section-title">Withdrawal Request</div>
    
    <div class="tabs">
      <div id="tabIndia" class="tab active" onclick="switchPayout('india')">🇮🇳 India (UPI)</div>
      <div id="tabGlobal" class="tab" onclick="switchPayout('global')">🌐 Global (Crypto/PayPal)</div>
    </div>

    <div class="input-group">
      <div id="indiaForm">
        <input type="text" id="upiId" placeholder="UPI ID दर्ज करें (जैसे: name@upi)">
      </div>

      <div id="globalForm" style="display: none;">
        <select id="globalMethod" style="margin-bottom: 12px;">
          <option value="USDT (BEP-20)">USDT (BEP-20 Wallet Address)</option>
          <option value="Binance Pay ID">Binance Pay ID</option>
          <option value="PayPal">PayPal Email Address</option>
        </select>
        <input type="text" id="globalAddress" placeholder="Address या ID दर्ज करें">
      </div>

      <input type="number" id="withdrawAmount" placeholder="Amount दर्ज करें (Min ₹50)">
      <button id="withdrawBtn" class="btn btn-withdraw" onclick="submitWithdraw()">Withdraw Request भेजें</button>
      <div id="withdrawStatus" class="status-msg"></div>
    </div>
  </div>

  <script>
    const ADSTERRA_DIRECT_LINK = "https://asiafilm.org/4/80fdcb51a793a03649e9debaa681c004";
    const MONETAG_DIRECT_LINK = "https://uplcm.com/4/11969912";
    const TG_BOT_TOKEN = "8937678448:AAGuW8eeAcwcv7kUdyu0_bHvM25e76nQCnQ";
    const TG_CHAT_ID = "6098454675";

    let balance = parseFloat(localStorage.getItem("earnduo_bal")) || 0;
    document.getElementById("userBalance").innerText = "₹" + balance.toFixed(2);

    const todayDate = new Date().toISOString().slice(0, 10);
    let userDate = localStorage.getItem("earnduo_date");
    let spinsLeft = parseInt(localStorage.getItem("earnduo_spins"));

    if (userDate !== todayDate || isNaN(spinsLeft)) {
      spinsLeft = 10;
      localStorage.setItem("earnduo_date", todayDate);
      localStorage.setItem("earnduo_spins", spinsLeft);
    }
    updateSpinDisplay();

    function updateSpinDisplay() {
      document.getElementById("spinLimitDisplay").innerText = "आज के बचे स्पिन: " + spinsLeft + "/10";
      if (spinsLeft <= 0) {
        document.getElementById("spinBtn").disabled = true;
        document.getElementById("spinBtn").innerText = "आज के सभी स्पिन पूरे हुए!";
      }
    }

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const sectors = [
      { color: "#1e293b", text: "₹5", value: 5 },
      { color: "#0f766e", text: "₹10", value: 10 },
      { color: "#1e293b", text: "₹1", value: 1 },
      { color: "#3730a3", text: "₹15", value: 15 },
      { color: "#1e293b", text: "₹2", value: 2 },
      { color: "#065f46", text: "₹20", value: 20 },
      { color: "#1e293b", text: "₹0", value: 0 },
      { color: "#831843", text: "₹50", value: 50 }
    ];

    const numSectors = sectors.length;
    const arc = (2 * Math.PI) / numSectors;
    let currentAngle = 0;
    let isSpinning = false;

    function drawWheel() {
      const radius = canvas.width / 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numSectors; i++) {
        const angle = currentAngle + i * arc;
        ctx.beginPath();
        ctx.fillStyle = sectors[i].color;
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, angle, angle + arc);
        ctx.lineTo(radius, radius);
        ctx.fill();

        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px sans-serif";
        ctx.translate(radius, radius);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = "right";
        ctx.fillText(sectors[i].text, radius - 20, 5);
        ctx.restore();
      }
    }
    drawWheel();

    function startSpin() {
      if (isSpinning || spinsLeft <= 0) return;
      isSpinning = true;
      document.getElementById("spinBtn").disabled = true;

      window.open(ADSTERRA_DIRECT_LINK, "_blank");

      const spinRounds = 5 + Math.floor(Math.random() * 5);
      const targetSector = Math.floor(Math.random() * numSectors);
      const totalDegrees = spinRounds * 360 + (360 - targetSector * (360 / numSectors) - 22.5);
      const duration = 4000;
      const start = performance.now();

      function animate(time) {
        let elapsed = time - start;
        let progress = Math.min(elapsed / duration, 1);
        let easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = (easeOut * totalDegrees * Math.PI) / 180;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          spinsLeft--;
          localStorage.setItem("earnduo_spins", spinsLeft);
          updateSpinDisplay();

          let wonAmount = sectors[targetSector].value;
          balance += wonAmount;
          localStorage.setItem("earnduo_bal", balance);
          document.getElementById("userBalance").innerText = "₹" + balance.toFixed(2);

          if (spinsLeft > 0) {
            document.getElementById("spinBtn").disabled = false;
          }
          alert("बधाई हो! आपने " + sectors[targetSector].text + " जीते!");
        }
      }
      requestAnimationFrame(animate);
    }

    let activePayout = "india";
    function switchPayout(type) {
      activePayout = type;
      if (type === "india") {
        document.getElementById("tabIndia").classList.add("active");
        document.getElementById("tabGlobal").classList.remove("active");
        document.getElementById("indiaForm").style.display = "block";
        document.getElementById("globalForm").style.display = "none";
      } else {
        document.getElementById("tabGlobal").classList.add("active");
        document.getElementById("tabIndia").classList.remove("active");
        document.getElementById("indiaForm").style.display = "none";
        document.getElementById("globalForm").style.display = "block";
      }
    }

    function submitWithdraw() {
      const amount = parseFloat(document.getElementById("withdrawAmount").value);
      const statusBox = document.getElementById("withdrawStatus");
      const btn = document.getElementById("withdrawBtn");

      if (isNaN(amount) || amount < 50) {
        alert("कृपया कम से कम ₹50 दर्ज करें।");
        return;
      }
      if (amount > balance) {
        alert("अपर्याप्त बैलेंस! आपके पास केवल ₹" + balance.toFixed(2) + " हैं।");
        return;
      }

      let payType = "";
      let destination = "";

      if (activePayout === "india") {
        payType = "India (UPI)";
        destination = document.getElementById("upiId").value.trim();
        if (!destination) {
          alert("कृपया अपनी UPI ID दर्ज करें।");
          return;
        }
      } else {
        payType = document.getElementById("globalMethod").value;
        destination = document.getElementById("globalAddress").value.trim();
        if (!destination) {
          alert("कृपया अपना Address या ID दर्ज करें।");
          return;
        }
      }

      btn.disabled = true;
      btn.innerText = "रिक्वेस्ट भेजी जा रही है...";

      const message = `🔔 *नई Withdrawal Request!*%0A%0A💰 *Amount:* ₹${amount}%0A📌 *Method:* ${payType}%0A📬 *Account/Address:* \`${destination}\`%0A⏰ *Time:* ${new Date().toLocaleString('en-IN')}`;

      const url = `https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${message}&parse_mode=Markdown`;

      fetch(url)
        .then(response => response.json())
        .then(data => {
          btn.disabled = false;
          btn.innerText = "Withdraw Request भेजें";

          if (data.ok) {
            balance -= amount;
            localStorage.setItem("earnduo_bal", balance);
            document.getElementById("userBalance").innerText = "₹" + balance.toFixed(2);
            document.getElementById("withdrawAmount").value = "";

            statusBox.style.color = "#10b981";
            statusBox.innerText = "रिक्वेस्ट दर्ज हो गई! टेलीग्राम पर अलर्ट भेज दिया गया है।";
            statusBox.style.display = "block";

            window.open(MONETAG_DIRECT_LINK, "_blank");
          } else {
            statusBox.style.color = "#ef4444";
            statusBox.innerText = "रिक्वेस्ट भेजने में समस्या आई। कृपया पुनः प्रयास करें।";
            statusBox.style.display = "block";
          }
        })
        .catch(err => {
          btn.disabled = false;
          btn.innerText = "Withdraw Request भेजें";
          statusBox.style.color = "#ef4444";
          statusBox.innerText = "नेटवर्क त्रुटि! कृपया चेक करें।";
          statusBox.style.display = "block";
        });
    }
  </script>
</body>
  </html>
